<!doctype html>
<!--
  rs-field-glass · ripple reel (9:16, 1080x1920, 18 s)
  Preset brief: ../README.md · tokens: tokens.css
  To make a new reel: edit the SCENE block below and the PLATES list in ../build.sh (plates land in assets/plates/ring-1..3.jpg).
  Every number on screen must have a `source` line. No source, no number.
-->
<html lang="tr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--humus); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--humus); color: var(--mist); font-family: var(--font-body); }

      .plate { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; opacity: 0; transform-origin: 50% 45%; }
      #plate-0 { opacity: 1; }
      .shade { position: absolute; inset: 0; background:
        linear-gradient(180deg, rgba(var(--humus-rgb),0.72) 0%, rgba(var(--humus-rgb),0.15) 22%, rgba(var(--humus-rgb),0.25) 45%, rgba(var(--humus-rgb),0.88) 64%, rgba(var(--humus-rgb),0.96) 100%); }
      .endwash { position: absolute; inset: 0; background: var(--humus); opacity: 0; }

      .label { position: absolute; left: var(--safe-side); right: var(--safe-side); top: 236px; display: flex; justify-content: space-between;
        font-size: var(--size-label); font-weight: 700; letter-spacing: var(--tracking-label); text-transform: uppercase; color: rgba(var(--mist-rgb),0.82); }
      .label .dot { color: var(--sprout-400); }

      #rings { position: absolute; inset: 0; width: 1080px; height: 1920px; }

      .hook { position: absolute; left: 0; right: 0; top: 700px; text-align: center; }
      .hook .name { font-family: var(--font-quote); font-style: italic; font-weight: 500; font-size: 120px; line-height: 1; }
      .hook .place { margin-top: 26px; font-size: var(--size-label); font-weight: 700; letter-spacing: var(--tracking-label); text-transform: uppercase; color: rgba(var(--mist-rgb),0.78); }

      .card { position: absolute; left: var(--safe-side); right: var(--safe-side); top: 1168px; padding: 40px 48px 38px;
        background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--card-radius);
        -webkit-backdrop-filter: blur(var(--card-blur)); backdrop-filter: blur(var(--card-blur)); opacity: 0; }
      .card .ring { font-size: var(--size-label); font-weight: 700; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--sprout-400); }
      .card .num { display: flex; align-items: flex-end; font-family: var(--font-number); font-weight: 600; font-size: var(--size-number); line-height: 1; margin-top: 14px; letter-spacing: -0.02em; }
      .card .num .unit { font-size: 96px; margin-left: 18px; padding-bottom: 18px; font-weight: 500; }
      .card .line { font-size: var(--size-line); line-height: 1.22; margin-top: 18px; }
      .card .line em { font-style: normal; color: var(--gold); }
      .card .attr { font-family: var(--font-quote); font-style: italic; font-size: 40px; margin-top: 14px; color: rgba(var(--mist-rgb),0.9); }
      .card .src { font-size: var(--size-source); margin-top: 22px; color: rgba(var(--mist-rgb),0.62); }

      .odo { display: inline-block; height: 1.04em; overflow: hidden; }
      .odo .col { display: flex; flex-direction: column; }
      .odo .col span { display: block; height: 1.04em; line-height: 1.04em; text-align: center; }
      .sep { display: inline-block; }

      .end { position: absolute; left: var(--safe-side); right: var(--safe-side); top: 1140px; text-align: center; opacity: 0; }
      .end .t1 { font-family: var(--font-quote); font-style: italic; font-weight: 500; font-size: 104px; line-height: 1.02; }
      .end .t2 { font-size: 34px; margin-top: 22px; color: rgba(var(--mist-rgb),0.82); }
      .end .t3 { font-size: var(--size-label); font-weight: 700; letter-spacing: var(--tracking-label); text-transform: uppercase; margin-top: 64px; color: var(--sprout-400); }
      .end .t4 { font-family: var(--font-quote); font-weight: 500; font-size: 40px; margin-top: 18px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="18" data-track-index="0" style="position:absolute;inset:0">
        <img class="plate" id="plate-0" src="assets/plates/ring-1.jpg" alt="" />
        <img class="plate" id="plate-1" src="assets/plates/ring-2.jpg" alt="" />
        <img class="plate" id="plate-2" src="assets/plates/ring-3.jpg" alt="" />
        <div class="shade"></div>
        <div class="endwash" id="endwash"></div>
        <svg id="rings" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="label"><span id="label-l"></span><span id="label-r"></span></div>
        <div class="hook" id="hook"><div class="name" id="hook-name"></div><div class="place" id="hook-place"></div></div>
        <div id="cards"></div>
        <div class="end" id="end"><div class="t1" id="end-t1"></div><div class="t2" id="end-t2"></div><div class="t3" id="end-t3"></div><div class="t4" id="end-t4"></div></div>
      </div>
    </div>

    <script>
      /* ===================== SCENE (the only block to edit per reel) ===================== */
      const SCENE = {
        label: ["Dalga etkisi", "Mikro Onarım"],
        hook: { name: "Burhan Eltan", place: "Kaz Dağları" },
        rings: [
          { ring: "Halka 1 · Bahçe",
            digits: "30", unit: "m²",
            line: "4 yatak × 7,5 m². Tek bir sebze bahçesi.",
            source: "Kaynak: Burhan Eltan röportajı, 2 Eki 2026 (A 10:02:22)" },
          { ring: "Halka 2 · Aile",
            text: "4–6", unit: "kişi",
            line: "Bir ailenin <em>sebzesi</em>. Tüm gıdası değil.",
            attr: "Burhan’ın gözlemi",
            source: "Kaynak: Burhan Eltan röportajı, 2 Eki 2026 (A 10:02:34)" },
          { ring: "Halka 3 · Film",
            digits: "225.349", unit: "",
            line: "kez izlendi. Yayından sonraki 15 günde.",
            source: "Kaynak: YouTube herkese açık sayaç, 7 Eki 2026" }
        ],
        end: { t1: "Mikro Onarım", t2: "Burhan: Rebuilt from the Ground Up", t3: "Filmin tamamı YouTube’da", t4: "Regenerative Stories" }
      };
      /* ==================================================================================== */

      const MOTION = { soft: "back.out(1.15)", ease: "power3.out", draw: "power2.inOut", out: "power2.in" };
      const T = { hookIn: 0.0, hookOut: 1.7, ring: [1.9, 6.0, 10.4], ringEnd: [5.6, 10.0, 14.6], end: 14.9, total: 18 };
      const C = { x: 540, y: 800, r: [104, 214, 330] };
      const NS = "http://www.w3.org/2000/svg";
      const $ = (id) => document.getElementById(id);
      const el = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent && parent.appendChild(n); return n; };

      // ---- static build (deterministic, no randomness) ----
      $("label-l").innerHTML = SCENE.label[0] + ' <span class="dot">●</span>';
      $("label-r").textContent = SCENE.label[1];
      $("hook-name").textContent = SCENE.hook.name;
      $("hook-place").textContent = SCENE.hook.place;
      ["t1", "t2", "t3", "t4"].forEach((k) => ($("end-" + k).textContent = SCENE.end[k]));

      const svg = $("rings");
      const g = el("g", { id: "ringgroup" }, svg);
      const circles = C.r.map((r, i) => el("circle", { cx: C.x, cy: C.y, r, fill: "none", stroke: "#6FA34D", "stroke-width": 4, pathLength: 1,
        "stroke-dasharray": 1, "stroke-dashoffset": 1, transform: `rotate(-90 ${C.x} ${C.y})`, "stroke-linecap": "round" }, g));
      // ring 1 inner: 4 beds (vertical strips) inside a 30 m² square
      const beds = [0, 1, 2, 3].map((k) => el("rect", { x: C.x - 62 + k * 32, y: C.y - 62, width: 26, height: 124, rx: 3, fill: "rgba(111,163,77,0.18)",
        stroke: "#F3F1EB", "stroke-width": 2.5, pathLength: 1, "stroke-dasharray": 1, "stroke-dashoffset": 1, opacity: 0 }, g));
      // ring 2: 6 dots, 4 solid + 2 open (the "4–6")
      const dots = [0, 1, 2, 3, 4, 5].map((k) => { const a = (-90 + k * 60) * Math.PI / 180;
        return el("circle", { cx: C.x + C.r[1] * Math.cos(a), cy: C.y + C.r[1] * Math.sin(a), r: 15,
          fill: k < 4 ? "#6FA34D" : "#181715", stroke: k < 4 ? "#6FA34D" : "#F3F1EB", "stroke-width": 3, opacity: 0 }, g); });
      // ring 3: 48 seed ticks around the outer ring
      const seeds = Array.from({ length: 48 }, (_, k) => { const a = (-90 + k * 7.5) * Math.PI / 180;
        return el("circle", { cx: C.x + C.r[2] * Math.cos(a), cy: C.y + C.r[2] * Math.sin(a), r: 4, fill: "#F3F1EB", opacity: 0 }, g); });
      const pulse = el("circle", { cx: C.x, cy: C.y, r: C.r[2], fill: "none", stroke: "#F3F1EB", "stroke-width": 2, opacity: 0 }, g);
      const center = el("circle", { cx: C.x, cy: C.y, r: 7, fill: "#F6BF26", opacity: 0 }, g);

      // cards
      const DIGIT_H = 1.04; // em, matches .odo span
      const odoCols = [];
      SCENE.rings.forEach((r, i) => {
        const card = document.createElement("div");
        card.className = "card"; card.id = "card-" + i;
        let num = "";
        if (r.digits) {
          [...r.digits].forEach((ch, j) => {
            if (/\d/.test(ch)) {
              const fromRight = [...r.digits].slice(j).filter((c) => /\d/.test(c)).length - 1;
              const spins = 1 + Math.min(fromRight, 3);
              const seq = []; for (let s = 0; s < spins * 10 + Number(ch) + 1; s++) seq.push(s % 10);
              num += `<span class="odo" data-layout-allow-occlusion><span class="col" data-card="${i}" data-steps="${seq.length - 1}">${seq.map((d) => `<span>${d}</span>`).join("")}</span></span>`;
            } else num += `<span class="sep">${ch}</span>`;
          });
        } else num = `<span class="static">${r.text}</span>`;
        if (r.unit) num += `<span class="unit">${r.unit}</span>`;
        card.innerHTML = `<div class="ring">${r.ring}</div><div class="num">${num}</div><div class="line">${r.line}</div>` +
          (r.attr ? `<div class="attr">${r.attr}</div>` : "") + `<div class="src">${r.source}</div>`;
        $("cards").appendChild(card);
      });

      // ---- timeline ----
      const tl = gsap.timeline({ paused: true });
      const fontPx = 200;

      // hook
      tl.fromTo("#hook", { opacity: 1, y: 0 }, { opacity: 1, duration: 0.01 }, 0);
      tl.to("#hook", { opacity: 0, y: -40, duration: 0.5, ease: MOTION.out }, T.hookOut);

      SCENE.rings.forEach((r, i) => {
        const t0 = T.ring[i], t1 = T.ringEnd[i];
        const plate = "#plate-" + i;
        // plate: crossfade in, slow push, focus-pull to data (field glass)
        if (i > 0) tl.fromTo(plate, { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "sine.inOut" }, t0 - 0.4);
        tl.fromTo(plate, { scale: 1.0, filter: "blur(0px)" }, { scale: 1.07, duration: (t1 - t0) + 1.2, ease: "none" }, Math.max(0, t0 - 0.4));
        tl.to(plate, { filter: "blur(5px)", duration: 1.0, ease: "sine.inOut" }, t0 + 0.6);
        if (i > 0) tl.to("#plate-" + (i - 1), { opacity: 0, duration: 0.7, ease: "sine.inOut" }, t0 - 0.4);

        // ring draw-on; previous rings dim to mist hairline
        tl.to(circles[i], { attr: { "stroke-dashoffset": 0 }, duration: 1.0, ease: MOTION.draw }, t0);
        if (i > 0) tl.to(circles[i - 1], { attr: { stroke: "#F3F1EB", "stroke-width": 2 }, opacity: 0.45, duration: 0.6 }, t0);

        // card in, number, out
        const card = "#card-" + i;
        tl.fromTo(card, { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.8, ease: MOTION.soft }, t0 + 0.35);
        document.querySelectorAll('.col[data-card="' + i + '"]').forEach((col, j, all) => {
          const steps = Number(col.dataset.steps);
          tl.fromTo(col, { y: 0 }, { y: -steps * DIGIT_H * fontPx, duration: 1.3 + 0.12 * (all.length - j), ease: "power3.inOut" }, t0 + 0.55);
        });
        if (r.text) tl.fromTo(card + " .static", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.7, ease: MOTION.soft, transformOrigin: "0% 100%" }, t0 + 0.6);
        tl.to(card, { opacity: 0, y: -30, duration: 0.45, ease: MOTION.out }, t1);
      });

      // ring-specific marks
      tl.to(beds, { attr: { "stroke-dashoffset": 0 }, opacity: 1, duration: 0.7, ease: MOTION.draw, stagger: 0.12 }, T.ring[0] + 0.5);
      tl.to(center, { opacity: 1, duration: 0.4 }, T.ring[0] + 0.2);
      tl.to(beds, { opacity: 0.55, duration: 0.6 }, T.ring[1]);
      dots.forEach((d, k) => tl.fromTo(d, { opacity: 0, y: -140 }, { opacity: 1, y: 0, duration: 0.9, ease: MOTION.soft }, T.ring[1] + 0.7 + k * 0.13));
      tl.to(dots, { opacity: 0.6, duration: 0.6 }, T.ring[2]);
      tl.to(seeds, { opacity: 0.85, duration: 0.25, stagger: 0.025 }, T.ring[2] + 0.6);
      tl.set(pulse, { opacity: 0.35 }, T.ring[2] + 1.6);
      tl.to(pulse, { opacity: 0, attr: { r: C.r[2] + 120 }, duration: 1.6, ease: "sine.out" }, T.ring[2] + 1.6);

      // end card: plates wash to humus, rings settle up and small, credit title
      tl.to(circles[2], { attr: { stroke: "#F3F1EB", "stroke-width": 2 }, opacity: 0.45, duration: 0.6 }, T.end);
      tl.to("#endwash", { opacity: 0.86, duration: 0.9, ease: "sine.inOut" }, T.end);
      tl.to("#ringgroup", { scale: 0.62, y: -150, svgOrigin: `${C.x} ${C.y}`, duration: 1.1, ease: MOTION.soft }, T.end);
      tl.fromTo("#end", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.9, ease: MOTION.soft }, T.end + 0.5);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
